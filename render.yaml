services:
  - type: web
    name: roger-sim-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: DEEPSEEK_GENERIC_API_KEY
        sync: false
      - key: MIMO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      # Private secrets file (Keywebco/roger-sim-brain secrets/roger-sim-secrets.md).
      # Value: a GitHub fine-grained token, read-only Contents on roger-sim-brain.
      # Roger sets it in the Render dashboard; never commit a value.
      - key: SIM_PRIVATE_BRAIN_TOKEN
        sync: false
